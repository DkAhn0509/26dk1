<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>빛과 별 탐사대</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<script>
/* =====================================================================
   설정: 아래 따옴표 안에 Code.gs 웹 앱 주소(…/exec)를 붙여 넣으세요.
   비워 두면 "체험 모드"로 동작합니다(기록이 이 기기에만 저장됨).
   ===================================================================== */
window.API_URL = "https://script.google.com/macros/s/AKfycbzWE6VDikAzYadcW-AbmnliIGPPqyjRePqHxlbWuI9y6nDtT8eqbJ4yYjmkihR35VmB/exec";
</script>
<style>
/* Layout: one-screen landscape cockpit. The side-scroll world fills the canvas, a thin HUD strip rides on top,
   thumb pads sit in the bottom corners, and each mission console slides over as a two-pane panel (experiment left, mission right). */
:root{
  color-scheme:dark;
  --space:#0b1030; --deep:#070b24; --hull:#151b45; --hull2:#1f2760; --line:#343e86;
  --glass:rgba(21,27,69,.88);
  --ink:#eef1ff; --dim:#a9b0dc;
  --photon:#ffd447; --r:#ff5468; --g:#3fe08a; --b:#5a93ff;
  --display:'Do Hyeon','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
  --body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;
}
html,body{height:100%}
body{background:var(--space);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--photon);outline-offset:2px}
#app{position:relative;height:100%;overflow:hidden}
#game{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.screen{position:absolute;inset:0;overflow-y:auto;padding-block:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(110% 70% at 85% 0%,var(--hull2),transparent 62%),var(--space)}
.btn{font-family:var(--display);font-size:20px;border:0;border-radius:12px;padding:10px 22px;min-height:48px;
  background:var(--photon);color:var(--deep)}
.btn:active{transform:translateY(2px)}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid var(--line)}
.btn.small{font-size:16px;min-height:40px;padding:6px 14px}
.btn[disabled]{opacity:.4}

/* title */
#title{display:flex;align-items:center;justify-content:center}
.titlebox{display:grid;grid-template-columns:auto minmax(0,440px);gap:40px;align-items:center}
.rgb{position:relative;width:230px;height:220px;isolation:isolate;background:var(--deep);border-radius:50%}
.rgb i{position:absolute;width:120px;height:120px;border-radius:50%;mix-blend-mode:screen}
.rgb i:nth-child(1){background:#ff0000;left:55px;top:18px}
.rgb i:nth-child(2){background:#00ff00;left:22px;top:76px}
.rgb i:nth-child(3){background:#0000ff;left:88px;top:76px}
.titlecopy{display:flex;flex-direction:column;gap:14px}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--photon)}
#title h1{font-size:64px;line-height:1.02}
.titlecopy ul{margin:0;padding-left:18px;color:var(--dim)}
.nick{display:flex;flex-direction:column;gap:4px}
.nick input{font:inherit;font-size:17px;color:var(--ink);background:var(--deep);border:2px solid var(--line);border-radius:10px;
  padding:10px 12px;min-height:46px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.rot{display:none;color:var(--photon);font-size:13px}
@media (orientation:portrait){.rot{display:block}}
@media (max-width:720px){.titlebox{grid-template-columns:1fr;gap:18px;justify-items:start}.rgb{width:150px;height:144px}
  .rgb i{width:78px;height:78px}.rgb i:nth-child(1){left:36px;top:12px}.rgb i:nth-child(2){left:14px;top:50px}.rgb i:nth-child(3){left:58px;top:50px}
  #title h1{font-size:44px}#title{align-items:flex-start}}

/* map */
.maphead{display:flex;gap:16px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.crew{display:flex;flex-direction:column;gap:2px;min-width:0}
.crew h2{font-size:28px}
.xpbar{width:min(320px,70vw);height:10px;border-radius:5px;background:var(--deep);border:1px solid var(--line);overflow:hidden}
.xpbar b{display:block;height:100%;background:linear-gradient(90deg,var(--r),var(--photon),var(--g),var(--b))}
.stats{display:flex;gap:18px;font-variant-numeric:tabular-nums}
.stats div{display:flex;flex-direction:column}
.stats span{font-size:12px;color:var(--dim);letter-spacing:.06em}
.stats strong{font-family:var(--display);font-weight:400;font-size:26px;color:var(--photon)}
.tabs{display:flex;gap:6px;margin-block:14px 12px;border-bottom:2px solid var(--line)}
.tabs button{font-family:var(--display);font-size:19px;background:none;border:0;padding:8px 16px;color:var(--dim);border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--photon)}
.world{margin-bottom:18px}
.world h3{font-size:21px;margin-bottom:8px}
.world h3 small{font-family:var(--body);font-size:13px;color:var(--dim);margin-left:8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.stage{display:flex;flex-direction:column;gap:2px;text-align:left;background:var(--hull);border:1px solid var(--line);border-radius:14px;padding:12px 14px;min-height:112px}
.stage .no{font-size:12px;color:var(--dim);letter-spacing:.08em}
.stage .nm{font-family:var(--display);font-size:21px;line-height:1.15}
.stage .pl{font-size:13px;color:var(--dim)}
.stage .st{margin-top:auto;font-size:19px;letter-spacing:2px;color:var(--photon)}
.stage .st em{font-style:normal;color:var(--line)}
.stage.locked{opacity:.45}
.stage.locked .st{font-size:13px;letter-spacing:0;color:var(--dim)}
.badge{display:flex;gap:12px;align-items:center;background:var(--hull);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.medal{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-size:22px;
  background:var(--deep);color:var(--line);border:3px solid var(--line)}
.badge.on .medal{color:var(--deep);border-color:var(--ink);background:conic-gradient(from 210deg,var(--r),var(--photon),var(--g),var(--b),var(--r))}
.badge:not(.on){opacity:.6}
.badge strong{display:block;font-family:var(--display);font-weight:400;font-size:18px}
.badge span{font-size:13px;color:var(--dim)}
.card{background:var(--hull);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:19px}
.card ul{margin:0;padding-left:18px;font-size:14px}
.card.locked{color:var(--dim)}
.mapfoot{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:8px;color:var(--dim);font-size:13px}

/* hud + pads */
#hud{position:absolute;top:0;left:0;right:0;display:flex;gap:8px;align-items:center;padding-block:10px;pointer-events:none;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(10px + env(safe-area-inset-top,0px))}
#hud>*{pointer-events:auto}
.chip{background:var(--glass);border:1px solid var(--line);border-radius:999px;padding:6px 14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.chip b{font-family:var(--display);font-weight:400;font-size:18px;color:var(--photon)}
#hudStage{font-family:var(--display);font-size:18px;overflow:hidden;text-overflow:ellipsis;min-width:0}
.spacer{flex:1}
.pad{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:flex-end}
.pad.l{left:max(18px,env(safe-area-inset-left,0px))}
.pad.r{right:max(18px,env(safe-area-inset-right,0px))}
.pad button{width:84px;height:84px;border-radius:50%;border:2px solid var(--line);background:var(--glass);font-family:var(--display);font-size:22px;touch-action:none}
.pad button:active,.pad button.down{background:var(--hull2);border-color:var(--photon)}
.pad .jump{width:100px;height:100px;border-color:var(--b)}
.pad .act{border-color:var(--photon);color:var(--photon);animation:pulse 1s infinite alternate}
@keyframes pulse{to{box-shadow:0 0 0 8px rgba(255,212,71,.18)}}
@media (prefers-reduced-motion:reduce){.pad .act{animation:none}}
@media (max-width:520px){.pad button{width:64px;height:64px;font-size:18px}.pad .jump{width:76px;height:76px}.chip.opt{display:none}}

/* sim console */
#sim{background:var(--space)}
.simwrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(280px,350px);gap:14px;height:100%}
#simBox{position:relative;background:var(--deep);border:1px solid var(--line);border-radius:16px;overflow:hidden;min-height:240px}
#simCanvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#simRead{position:absolute;left:12px;bottom:10px;right:12px;font-family:var(--display);font-size:19px;color:var(--photon);pointer-events:none}
.simside{display:flex;flex-direction:column;gap:10px;min-width:0;overflow-y:auto}
.simtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.simtop h2{font-size:24px}
.dots{display:flex;gap:6px}
.dots i{width:26px;height:8px;border-radius:4px;background:var(--line)}
.dots i.done{background:var(--g)}.dots i.now{background:var(--photon)}
#simText{font-size:16px;font-weight:500}
#simControls{display:flex;flex-direction:column;gap:10px}
.ctl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;background:var(--hull);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.ctl label,.ctl .lab{font-size:13px;color:var(--dim)}
.ctl output{font-family:var(--display);font-size:19px;color:var(--photon);font-variant-numeric:tabular-nums}
.ctl input[type=range]{grid-column:1/-1;width:100%;height:36px;accent-color:var(--photon);touch-action:pan-y}
.seg{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 auto;min-height:44px;border-radius:10px;border:2px solid var(--line);background:var(--deep);padding:4px 10px;font-weight:500}
.seg button[aria-pressed="true"]{border-color:var(--photon);background:var(--hull2)}
.seg button.tr[aria-pressed="true"]{border-color:var(--r);color:var(--r)}
.seg button.tg[aria-pressed="true"]{border-color:var(--g);color:var(--g)}
.seg button.tb[aria-pressed="true"]{border-color:var(--b);color:var(--b)}
#simOptions{display:flex;flex-direction:column;gap:8px}
#simOptions button{text-align:left;min-height:46px;border-radius:12px;border:2px solid var(--line);background:var(--hull);padding:8px 14px;font-weight:500}
#simOptions button.wrong{border-color:var(--r);opacity:.5}
#simOptions button.right{border-color:var(--g);color:var(--g)}
#simFeedback{border-radius:12px;padding:10px 12px;font-size:14px;border:1px solid var(--line);background:var(--deep)}
#simFeedback.good{border-color:var(--g)}#simFeedback.bad{border-color:var(--r)}#simFeedback.hint{border-color:var(--photon)}
@media (max-width:760px){.simwrap{grid-template-columns:1fr;height:auto}#simBox{height:46vh}}

/* result */
#result{display:flex;align-items:center;justify-content:center}
.resbox{width:min(640px,100%);display:flex;flex-direction:column;gap:12px}
.resbox h2{font-size:38px}
.bigstars{font-size:54px;letter-spacing:8px;color:var(--photon);line-height:1}
.bigstars em{font-style:normal;color:var(--line)}
.tally{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-variant-numeric:tabular-nums;background:var(--hull);border:1px solid var(--line);border-radius:14px;padding:12px 16px}
.tally dt{color:var(--dim)}.tally dd{margin:0;text-align:right;font-family:var(--display);font-size:19px}
.tally .tot{color:var(--photon);font-size:24px}
.news{display:flex;flex-direction:column;gap:6px}
.news p{border-left:4px solid var(--photon);padding-left:10px}

#toast{position:absolute;left:50%;top:calc(64px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--glass);
  border:1px solid var(--photon);border-radius:12px;padding:8px 18px;font-family:var(--display);font-size:19px;max-width:90%;text-align:center;pointer-events:none}

/* ===== standalone reset (GitHub Pages) ===== */
html{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}

/* ===== login / password ===== */
#login,#pw{display:flex;align-items:center;justify-content:center}
.loginbox{display:grid;grid-template-columns:minmax(0,380px) minmax(0,500px);gap:36px;align-items:start;width:min(940px,100%)}
.brand{display:flex;gap:14px;align-items:center}
.brand h1{font-size:44px;line-height:1.02}
.rgb.sm{width:104px;height:100px;flex:none}
.rgb.sm i{width:54px;height:54px}
.rgb.sm i:nth-child(1){left:25px;top:8px}.rgb.sm i:nth-child(2){left:10px;top:34px}.rgb.sm i:nth-child(3){left:40px;top:34px}
.form{display:flex;flex-direction:column;gap:10px;margin-top:14px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--dim)}
.field input{font:inherit;font-size:18px;color:var(--ink);background:var(--deep);border:2px solid var(--line);border-radius:10px;
  padding:10px 12px;min-height:48px;-webkit-user-select:text;user-select:text}
.msg{min-height:22px;color:var(--r);font-size:14px}
.notice{border:1px solid var(--photon);border-radius:10px;padding:8px 12px;font-size:13px;color:var(--photon)}
.pwbox{width:min(420px,100%);display:flex;flex-direction:column;gap:6px}
.pwbox h2{font-size:32px}
.dim{color:var(--dim);font-size:13px}

/* ===== ranking ===== */
.rankcard{background:var(--hull);border:1px solid var(--line);border-radius:16px;padding:14px 16px}
.rankhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.rankhead h3{font-size:22px}
.rankhead span{font-size:12px;color:var(--dim)}
.rankcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px}
.rankcols h4{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:16px;color:var(--photon)}
.rk{display:grid;grid-template-columns:30px minmax(0,1fr) auto;gap:6px;padding:3px 6px;border-radius:6px;font-variant-numeric:tabular-nums;font-size:14px}
.rk b{font-family:var(--display);font-weight:400;color:var(--dim)}
.rk.top b{color:var(--photon)}
.rk.me{background:var(--hull2);outline:1px solid var(--photon)}
.rk.gap{color:var(--dim);grid-template-columns:1fr;text-align:center;padding:0}
.myrank{font-size:13px;color:var(--photon)}
.stage .sc{font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.stage .sc i{font-style:normal;color:var(--g)}

/* ===== modal / hidden room ===== */
#modal{position:absolute;inset:0;background:rgba(7,11,36,.82);display:flex;align-items:center;justify-content:center;padding:16px}
.modalbox{background:var(--hull);border:2px solid var(--photon);border-radius:18px;padding:20px 22px;max-width:480px;display:flex;flex-direction:column;gap:10px}
.modalbox h2{font-size:28px}
#simIntro{font-size:14px;color:var(--dim);border-left:3px solid var(--photon);padding-left:10px}
#simTimer{font-family:var(--display);font-size:22px;color:var(--r);font-variant-numeric:tabular-nums}
.chip.warn{border-color:var(--r)}
.chip.warn b{color:var(--r)}
#hudEnergy b{letter-spacing:2px;color:var(--g)}
.tally .sub{color:var(--ink);border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
@media (max-width:820px){.loginbox{grid-template-columns:1fr;gap:18px}#login{align-items:flex-start}.brand h1{font-size:34px}}
</style>
</head>
<body>
<div id="app">
  <canvas id="game"></canvas>

  <div id="hud" hidden>
    <span class="chip" id="hudStage"></span>
    <span class="chip" id="hudTimeBox">시간 <b id="hudTime">0:00</b></span>
    <span class="spacer"></span>
    <span class="chip" id="hudEnergy">에너지 <b id="hudEn">●●●</b></span>
    <span class="chip" id="hudPhBox">광자 <b id="hudPhoton">0</b>/10</span>
    <span class="chip opt">미션 <b id="hudMission">대기</b></span>
    <button class="btn ghost small" id="btnMute" type="button">소리 켬</button>
    <button class="btn ghost small" id="btnQuit" type="button">지도</button>
  </div>
  <div class="pad l" id="padL" hidden>
    <button type="button" id="bLeft" aria-label="왼쪽으로 이동">◀</button>
    <button type="button" id="bRight" aria-label="오른쪽으로 이동">▶</button>
  </div>
  <div class="pad r" id="padR" hidden>
    <button type="button" id="bAct" class="act" hidden>조사</button>
    <button type="button" id="bJump" class="jump">점프</button>
  </div>

  <section class="screen" id="login">
    <div class="loginbox">
      <div>
        <div class="brand">
          <div class="rgb sm" aria-hidden="true"><i></i><i></i><i></i></div>
          <div><p class="eyebrow">중2 과학 · 빛 / 별과 우주</p><h1>빛과 별<br>탐사대</h1></div>
        </div>
        <form class="form" id="loginForm" autocomplete="off">
          <div class="field"><label for="inId">학번 (5자리)</label><input id="inId" type="text" inputmode="numeric" maxlength="5" placeholder="예: 20101"></div>
          <div class="field"><label for="inPw">비밀번호</label><input id="inPw" type="password" maxlength="40" placeholder="처음에는 학번!!"></div>
          <p class="msg" id="loginMsg"></p>
          <div class="row">
            <button class="btn" id="btnLogin" type="submit">로그인</button>
            <button class="btn ghost" id="btnFull" type="button">전체 화면</button>
          </div>
          <p class="notice" id="demoNote" hidden>체험 모드: 서버 주소(API_URL)가 설정되지 않아 기록이 이 기기에만 저장됩니다. 아무 5자리 학번과 "학번!!"으로 로그인할 수 있습니다.</p>
          <p class="rot">태블릿을 가로로 돌리면 화면이 넓어진다.</p>
        </form>
      </div>
      <div class="rankcard" id="rankLogin"></div>
    </div>
  </section>

  <section class="screen" id="pw" hidden>
    <form class="pwbox form" id="pwForm" autocomplete="off">
      <p class="eyebrow">보안 설정</p>
      <h2>비밀번호 변경</h2>
      <p class="dim" id="pwWhy">처음 로그인했다. 나만 아는 비밀번호로 바꿔야 탐사를 시작할 수 있다.</p>
      <div class="field"><label for="pw1">새 비밀번호 (8자리 이상)</label><input id="pw1" type="password" maxlength="40"></div>
      <div class="field"><label for="pw2">새 비밀번호 확인</label><input id="pw2" type="password" maxlength="40"></div>
      <p class="msg" id="pwMsg"></p>
      <div class="row">
        <button class="btn" id="btnPw" type="submit">변경하고 시작</button>
        <button class="btn ghost" id="btnPwCancel" type="button">취소</button>
      </div>
    </form>
  </section>

  <section class="screen" id="map" hidden>
    <div class="maphead">
      <div class="crew">
        <span class="eyebrow" id="mapRank"></span>
        <h2 id="mapName"></h2>
        <div class="xpbar"><b id="mapXp"></b></div>
        <span id="mapNext" style="font-size:13px;color:var(--dim)"></span>
        <span class="myrank" id="mapMyRank"></span>
      </div>
      <div class="stats">
        <div><span>총점</span><strong id="sXp">0</strong></div>
        <div><span>별</span><strong id="sStar">0</strong></div>
        <div><span>숨은 공간</span><strong id="sHid">0</strong></div>
        <div><span>뱃지</span><strong id="sBg">0</strong></div>
      </div>
    </div>
    <div class="tabs" role="tablist">

/* ---------- 계정·점수 규칙·서버 통신 ---------- */
const API_URL=String(window.API_URL||'').trim(),DEMO=!/^https:\/\//.test(API_URL);
let prefs={mute:false};try{prefs=Object.assign(prefs,JSON.parse(localStorage.getItem('lsc-prefs'))||{})}catch(e){}

let me=null,rankData=null;

/* 체험 모드(서버 없이 이 기기에만 저장) */
function demoApi(a,d){
 let db={};try{db=JSON.parse(localStorage.getItem('lsc-demo'))||{}}catch(e){}
 const id=d.id||String(d.token||'').split('.')[0],u=id?(db[id]=db[id]||{pw:null,st:{},badges:[]}):null;let out={ok:true};
 const R=s=>u.st[s]=Object.assign(blankRec(),u.st[s]);
 if(a==='login'){if(!/^\d{5}$/.test(d.id)||d.pw!==(u.pw||d.id+'!!'))return{ok:false,err:'학번 또는 비밀번호가 올바르지 않습니다.'};out=Object.assign(out,{id,token:id+'.demo',mustChange:!u.pw,st:u.st,badges:u.badges,openAll:false})}
 else if(a==='state'){if(!u)return{ok:false,err:'AUTH: 다시 로그인하세요.'};out=Object.assign(out,{id,mustChange:!u.pw,st:u.st,badges:u.badges,openAll:false})}
 else if(a==='changePw'){if(d.newPw.length<8)return{ok:false,err:'비밀번호는 8자리 이상이어야 합니다.'};if(d.newPw===id+'!!')return{ok:false,err:'초기 비밀번호와 다른 비밀번호를 정하세요.'};u.pw=d.newPw;out.token=id+'.demo'}
 else if(a==='attempt'){const r=R(d.stage);r.a++;out.stage=d.stage;out.rec=r}
 else if(a==='finish'){const r=R(d.stage);if(!r.a)r.a=1;const c=calc(d.mission,d.photons,d.hits,d.time,r.a);if(!r.clr||c.score>r.s||(c.score===r.s&&d.time<r.t))Object.assign(r,{s:c.score,acc:c.acc,tb:c.tb,t:d.time,star:starOf(c.score),ph:d.photons});r.clr=true;u.badges=[...new Set(u.badges.concat(d.badges||[]))];out.stage=d.stage;out.rec=r;out.badges=u.badges}
 else if(a==='hstart'){const r=R(d.stage);r.ht++;out.stage=d.stage;out.rec=r}
 else if(a==='hdone'){const r=R(d.stage);if(d.ok)r.hb=Math.max(r.hb,hBonus(r.ht));out.stage=d.stage;out.rec=r}
 else if(a==='rank'){const list=Object.keys(db).map(k=>({id:k,total:Object.values(db[k].st).reduce((s,r)=>s+(r.s||0)+(r.hb||0),0)})).filter(x=>x.total>0).sort((x,y)=>y.total-x.total);
  const cl={};Object.keys(db).forEach(k=>{const c=cl[k.slice(0,3)]=cl[k.slice(0,3)]||{key:k.slice(0,3),label:clsLabel(k),n:0,sum:0};c.n++;c.sum+=(list.find(x=>x.id===k)||{total:0}).total});
  const now=new Date();out.updated=[now.getHours(),now.getMinutes(),now.getSeconds()].map(v=>String(v).padStart(2,'0')).join(':');
  out.top=list.slice(0,10).map((x,i)=>({rank:i+1,id:x.id,total:x.total}));out.classes=Object.values(cl).filter(c=>c.sum>0).map(c=>({key:c.key,label:c.label,avg:Math.round(c.sum/c.n)})).sort((x,y)=>y.avg-x.avg);
  if(id&&u){const key=id.slice(0,3);let n=0;out.myClass=[];out.classKey=key;list.forEach((x,i)=>{if(x.id.slice(0,3)===key){n++;out.myClass.push({rank:n,id:x.id,total:x.total})}if(x.id===id)out.me={rank:i+1,total:x.total,classRank:n}})}
  return out}
 try{localStorage.setItem('lsc-demo',JSON.stringify(db))}catch(e){}
 return out}

function post(action,data){
 data=Object.assign({action},data);
 const fail=m=>Object.assign(new Error(m),{server:true});
 if(DEMO)return new Promise((res,rej)=>setTimeout(()=>{const r=demoApi(action,data);r.ok?res(r):rej(fail(r.err))},120));
 const ctl=new AbortController(),tm=setTimeout(()=>ctl.abort(),25000);
 return fetch(API_URL,{method:'POST',body:JSON.stringify(data),signal:ctl.signal,redirect:'follow'}).then(r=>r.json())
  .then(j=>{if(!j||!j.ok)throw fail((j&&j.err)||'서버 오류');return j}).finally(()=>clearTimeout(tm))}
const call=(action,data)=>post(action,Object.assign({token:me&&me.token},data));

/* 보낼 기록 대기열: 연결이 끊겨도 보관했다가 순서대로 다시 보낸다 */
let queue=[];try{queue=JSON.parse(localStorage.getItem('lsc-q'))||[]}catch(e){}
const saveQ=()=>{try{localStorage.setItem('lsc-q',JSON.stringify(queue))}catch(e){}};
let flushing=false,syncErr=false;
function enqueue(action,data){if(!me)return;queue.push({action,data:Object.assign({token:me.token},data)});saveQ();flush()}
async function flush(){
 if(flushing)return;flushing=true;paintSync();
 while(queue.length){const it=queue[0];
  try{const r=await post(it.action,it.data);syncErr=false;
   if(me&&it.data.token===me.token&&queue.length===1){if(r.rec&&r.stage)me.st[r.stage]=r.rec;if(r.badges)me.badges=r.badges;if(it.action==='finish'||it.action==='hdone')setTimeout(()=>{loadRank();if(state==='map')renderMap()},400)}}
  catch(e){if(!e.server){syncErr=true;break}}
  queue.shift();saveQ()}
 flushing=false;paintSync()}
setInterval(()=>{if(queue.length)flush()},15000);
function paintSync(){const t=queue.length?(syncErr?'연결을 기다리는 기록 '+queue.length+'건. 연결되면 자동으로 저장된다.':'기록 저장 중…'):(DEMO?'체험 모드: 기록은 이 기기에만 저장된다.':'모든 기록이 저장되었다.');document.querySelectorAll('.sync,#syncState').forEach(e=>{e.textContent=t})}

/* ---------- 소리 ---------- */
let AC=null;
function beep(f,d,type,vol){if(prefs.mute)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||.06;g.gain.exponentialRampToValueAtTime(.0001,AC.currentTime+(d||.08));o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.08))}catch(e){}}

 draw(c,w,h,s){

   const real=I.v>0,dx=real?I.ix:-I.ix,dy=real?I.hi-ho:ho-I.hi;ray(0,ho,dx*F,ho+dy*F,y);
   if(I.isL){ray(-u,ho,u*F,-ho*F,C.g)}else{ray(-u,ho,0,0,C.g);ray(0,0,-u*F,-ho*F,C.g)}
   if(!real){ray(0,ho,I.ix,I.hi,y,1);ray(I.isL?-u:0,I.isL?ho:0,I.ix,I.hi,C.g,1)}

 }

galaxy:{title:'외부 은하의 분류',intro:'허블은 외부 은하를 모양에 따라 타원 은하, 정상 나선 은하, 막대 나선 은하, 불규칙 은하로 나누었다.',

 steps:[{text:'세 은하 중 우리은하와 같은 종류는 어느 것일까?',options:['A: 나선팔이 없는 타원 모양','B: 둥근 중심부에서 나선팔이 뻗어 나옴','C: 중심을 가로지르는 막대 끝에서 나선팔이 뻗어 나옴'],answer:2,
  explain:'우리은하는 중심부에 막대 구조가 있는 막대 나선 은하다. A는 타원 은하, B는 정상 나선 은하다.'}],
 draw(c,w,h){starfield(c,w,h);const R=Math.min(w*.14,h*.3),cy=h*.45;
  [.18,.5,.82].forEach((f,i)=>{const cx=w*f;T(c,'ABC'[i],cx,cy-R-14,20,C.photon,'center',1);
   if(i===0){c.save();c.translate(cx,cy);c.scale(1,.68);glow(c,0,0,R,'255,226,170',.95);c.restore()}
   else{const pts=i===1?galPts.b:galPts.c;c.fillStyle='rgba(200,218,255,.85)';for(const p of pts)c.fillRect(cx+p[0]*R,cy+p[1]*R,1.8,1.8);
    if(i===1)glow(c,cx,cy,R*.3,'255,226,170',.95);else{c.save();c.translate(cx,cy);c.fillStyle='rgba(255,226,170,.9)';c.beginPath();c.ellipse(0,0,R*.44,R*.1,0,0,TAU);c.fill();c.restore();glow(c,cx,cy,R*.2,'255,226,170',.9)}}});}},
expand:{title:'허블 법칙',intro:'은하의 후퇴 속도는 거리에 비례한다. 그래프로 그리면 원점을 지나는 직선이 된다.',
 init:()=>({}),read:()=>'후퇴 속도 = 허블 상수 × 거리',
 steps:[{text:'100 Mpc 떨어진 은하의 후퇴 속도는 7000 km/s, 200 Mpc 떨어진 은하는 14000 km/s다. 300 Mpc 떨어진 은하의 후퇴 속도는?',options:['7000 km/s','14000 km/s','21000 km/s','28000 km/s'],answer:2,
  explain:'후퇴 속도는 거리에 비례하므로 3배 먼 은하는 3배 빠르게 멀어진다. 이 비례 상수(허블 상수)로 우주의 나이도 추정할 수 있다.'}],
 draw(c,w,h){const x0=w*.16,x1=w*.9,y0=h*.1,y1=h*.78,X=d=>x0+d/350*(x1-x0),Y=v=>y1-v/26000*(y1-y0);
  Ln(c,x0,y0,x0,y1,C.dim,2);Ln(c,x0,y1,x1,y1,C.dim,2);
  [100,200,300].forEach(d=>{Ln(c,X(d),y1-5,X(d),y1+5,C.dim,1.5);T(c,d+'',X(d),y1+22,12,C.dim,'center')});T(c,'거리 (Mpc)',x1,y1+40,12,C.dim,'right');
  [7000,14000].forEach(v=>{Ln(c,x0-5,Y(v),x0+5,Y(v),C.dim,1.5);T(c,v+'',x0-8,Y(v)+4,12,C.dim,'right')});T(c,'후퇴 속도 (km/s)',x0,y0-8,12,C.dim,'left');
  Ln(c,X(0),Y(0),X(330),Y(23100),C.line,2,[6,6]);dot(c,X(100),Y(7000),7,C.photon);dot(c,X(200),Y(14000),7,C.photon);
  c.strokeStyle=C.r;c.lineWidth=3;c.beginPath();c.arc(X(300),Y(21000),10,0,TAU);c.stroke();T(c,'?',X(300),Y(21000)-18,20,C.r,'center',1);}},
explore:{title:'정지 궤도',intro:'인공위성은 높이 돌수록 한 바퀴 도는 데 오래 걸린다. 공전 주기가 지구 자전 주기와 같으면, 지상에서는 위성이 하늘의 한곳에 멈춘 것처럼 보인다.',
 init:()=>({h:2000,t:0}),controls:[{type:'range',key:'h',label:'위성의 높이',min:2000,max:50000,step:2000,unit:' km'}],
 T:s=>2*Math.PI*Math.sqrt(Math.pow(6371+s.h,3)/398600)/3600,
 read(s){return '공전 주기 '+this.T(s).toFixed(1)+'시간 · 지구 자전 24시간'},
 update(s,dt){s.t+=dt},
 steps:[{text:'위성의 높이를 조절해 공전 주기를 지구 자전 주기(약 24시간)와 같게 만들자. 지상의 깃발과 위성이 나란히 돌면 성공이다.',ok:s=>Math.abs(HID.explore.T(s)-24)<.6,
  fail:s=>HID.explore.T(s)<24?'위성이 지구 자전보다 빨리 돌았다.':'위성이 지구 자전보다 느리게 돌았다.',
  explain:'높이 약 36000 km에서 공전 주기가 24시간이 된다. 이 정지 궤도의 위성은 늘 같은 지역 위에 있어 기상 관측과 방송 통신에 쓰인다.'}],
 draw(c,w,h,s){starfield(c,w,h);const cx=w/2,cy=h*.48,R=Math.min(w,h)*.085,ro=R*(1.25+s.h/50000*3.6),ae=s.t*TAU/8-Math.PI/2,as=s.t*TAU/8*(24/this.T(s))-Math.PI/2;
  c.strokeStyle='rgba(169,176,220,.35)';c.setLineDash([4,6]);c.beginPath();c.arc(cx,cy,ro,0,TAU);c.stroke();c.setLineDash([]);
  glow(c,cx,cy,R*1.5,'90,147,255',.5);dot(c,cx,cy,R,'#2f6fe0');
  Ln(c,cx+R*Math.cos(ae),cy+R*Math.sin(ae),cx+ro*Math.cos(ae),cy+ro*Math.sin(ae),'rgba(255,212,71,.35)',1.5,[3,5]);
  Ln(c,cx+R*Math.cos(ae),cy+R*Math.sin(ae),cx+(R+16)*Math.cos(ae),cy+(R+16)*Math.sin(ae),C.photon,4);
  const x=cx+ro*Math.cos(as),y=cy+ro*Math.sin(as);dot(c,x,y,5,'#fff');c.fillStyle=C.b;c.fillRect(x-12,y-2,7,4);c.fillRect(x+5,y-2,7,4);
  T(c,'깃발',cx,cy+4,12,'#fff','center');T(c,'크기와 거리는 실제 비율과 다르다',w-10,18,11,C.dim,'right');}}
};
const HID_CONCEPT={straight:'바늘구멍 사진기: 상의 크기는 스크린 거리에 비례',reflect:'잠망경: 45° 거울 두 장으로 빛을 두 번 꺾는다',refract:'전반사: 임계각보다 큰 입사각에서 빛이 모두 반사',lens:'근시는 오목 렌즈, 원시는 볼록 렌즈로 교정',color:'물체의 색: 반사하는 빛의 색으로 정해진다',parallax:'1 pc ≈ 3.26광년',bright:'광도: 별이 실제로 내는 빛의 양',magnitude:'등급 차 5 = 밝기 100배 = 거리 10배',temp:'색과 광도로 주계열성·거성을 구분',galaxy:'우리은하는 막대 나선 은하',expand:'허블 법칙: 후퇴 속도는 거리에 비례',explore:'정지 궤도: 높이 약 36000 km, 주기 24시간'};

/* ---------- 화면 전환·로그인·지도·랭킹 ---------- */
let state='login',run=null,sim=null,clock=0,tab='stages',logs=[],pwForced=true;
const keys={left:false,right:false,jumpQ:0,act:false};
const SCREENS=['login','pw','map','sim','result'];
function show(name){state=name;SCREENS.forEach(s=>{$('#'+s).hidden=s!==name});const p=name==='play';$('#hud').hidden=$('#padL').hidden=$('#padR').hidden=!p;$('#modal').hidden=true;keys.left=keys.right=false;if(p)resize()}
let toastT=0;function toast(m){const t=$('#toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},2600)}
const starStr=n=>'★'.repeat(n)+'<em>'+'★'.repeat(3-n)+'</em>';
const unlocked=i=>!!me.openAll||i===0||STAGES[i].world!==STAGES[i-1].world||cleared(STAGES[i-1].id);
const stageNo=i=>(STAGES[i].world+1)+'-'+(STAGES.slice(0,i+1).filter(d=>d.world===STAGES[i].world).length);

function rk(n,label,val,isMe){return `<div class="rk${n<=3?' top':''}${isMe?' me':''}"><b>${n}</b><span>${esc(label)}</span><span>${val}</span></div>`}
function rankHtml(full){
 const d=rankData,mid=me&&me.id,none='<p class="dim">아직 기록이 없다.</p>';
 let h=`<div class="rankhead"><h3>랭킹</h3><span>${d?'갱신 시각 '+esc(d.updated):''} <button class="btn ghost small" type="button" data-act="rank">새로 고침</button></span></div>`;
 if(!d)return h+'<p class="dim">랭킹을 불러오는 중이다.</p>';
 let a=d.top.map(r=>rk(r.rank,r.id,r.total,r.id===mid)).join('');
 if(mid&&d.me&&d.me.rank>10)a+='<div class="rk gap">···</div>'+rk(d.me.rank,mid,d.me.total,true);
 const b=d.classes.map((c,i)=>rk(i+1,c.label,c.avg,!!mid&&d.classKey===c.key)).join('');
 h+='<div class="rankcols"><div><h4>전체 상위 10명</h4>'+(a||none)+'</div><div><h4>학급 대항 (평균 점수)</h4>'+(b||none)+'</div>';
 if(full&&mid&&d.myClass)h+='<div><h4>우리 반 ('+clsLabel(mid)+')</h4>'+(d.myClass.map(r=>rk(r.rank,r.id,r.total,r.id===mid)).join('')||none)+'</div>';
 return h+'</div><p class="dim" style="margin-top:8px">랭킹은 최대 1분 간격으로 갱신된다. 동점이면 총 소요 시간이 짧은 쪽이 위다.</p>'}
function paintMyRank(){const d=rankData;$('#mapMyRank').textContent=d&&d.me&&me?'내 순위: 전체 '+d.me.rank+'위 · 우리 반 '+d.me.classRank+'위':''}
function paintRank(){$('#rankLogin').innerHTML=rankHtml(false);if(state==='map'){paintMyRank();if(tab==='rank')$('#mapBody').innerHTML='<div class="rankcard">'+rankHtml(true)+'</div>'}}
function loadRank(){return call('rank',{}).then(d=>{rankData=d;paintRank()}).catch(()=>{})}

function renderMap(){
 const x=total(),rkI=rank(x),nx=RANKS[rkI+1];
 $('#mapRank').textContent='대원 등급 '+(rkI+1)+' · '+RANKS[rkI][1];$('#mapName').textContent=me.id+' · '+clsLabel(me.id);
 $('#mapXp').style.width=(nx?(x-RANKS[rkI][0])/(nx[0]-RANKS[rkI][0])*100:100)+'%';
 $('#mapNext').textContent=nx?'다음 등급 '+nx[1]+'까지 '+(nx[0]-x)+'점':'최고 등급 달성';
 $('#sXp').textContent=x;$('#sStar').textContent=totStars()+'/36';$('#sHid').textContent=totHid()+'/12';$('#sBg').textContent=me.badges.length+'/'+BADGES.length;
 paintMyRank();paintSync();
 document.querySelectorAll('.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));
 let h='';
 if(tab==='stages')WORLDS.forEach((w,wi)=>{h+=`<div class="world"><h3>${w.title}<small>${w.unit}</small></h3><div class="grid">`;
  STAGES.forEach((d,i)=>{if(d.world!==wi)return;const u=unlocked(i),r=rec(d.id);
   h+=`<button type="button" class="stage${u?'':' locked'}" data-i="${i}" ${u?'':'disabled'}><span class="no">STAGE ${stageNo(i)}</span><span class="nm">${d.name}</span><span class="pl">${d.place}</span>`
    +(u?`<span class="sc">${r.clr?r.s+'점':(r.a?'도전 중':'미도전')}${r.hb?' <i>+'+r.hb+' 숨은 공간</i>':''}${r.a?' · 도전 '+r.a+'회':''}</span><span class="st">${starStr(r.clr?r.star:0)}</span>`:'<span class="st">앞 스테이지를 먼저 클리어</span>')+'</button>'});
  h+='</div></div>'});
 else if(tab==='rank')h='<div class="rankcard">'+rankHtml(true)+'</div>';
 else if(tab==='badges'){h='<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">';BADGES.forEach(b=>{const on=me.badges.includes(b.id);h+=`<div class="badge${on?' on':''}"><div class="medal">${b.name[0]}</div><div><strong>${b.name}</strong><span>${b.desc}</span></div></div>`});h+='</div>'}
 else{h='<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(280px,1fr))">';STAGES.forEach(d=>{const on=cleared(d.id),hb=rec(d.id).hb>0;h+=`<div class="card${on?'':' locked'}"><h4>${d.name}</h4>${on?'<ul>'+d.concept.map(c=>'<li>'+c+'</li>').join('')+(hb?'<li style="color:var(--photon)">확장: '+HID_CONCEPT[d.id]+'</li>':'')+'</ul>':'스테이지를 클리어하면 기록된다.'}</div>`});h+='</div>'}
 $('#mapBody').innerHTML=h;
}
function goMap(){run=null;sim=null;renderMap();show('map');loadRank()}

function setMe(r,token){me={id:r.id,token:token||r.token,st:r.st||{},badges:r.badges||[],openAll:!!r.openAll};try{sessionStorage.setItem('lsc-me',JSON.stringify({id:me.id,token:me.token}))}catch(e){}}
function logout(msg){me=null;run=null;sim=null;try{sessionStorage.removeItem('lsc-me')}catch(e){}$('#inPw').value='';$('#loginMsg').textContent=msg||'';show('login');loadRank()}
function askPw(forced){pwForced=forced;$('#pw1').value=$('#pw2').value='';$('#pwMsg').textContent='';$('#btnPwCancel').hidden=forced;$('#btnPw').textContent=forced?'변경하고 시작':'변경';$('#pwWhy').textContent=forced?'처음 로그인했다. 나만 아는 비밀번호로 바꿔야 탐사를 시작할 수 있다.':'새 비밀번호를 정한다.';show('pw')}
$('#loginForm').addEventListener('submit',e=>{e.preventDefault();const id=$('#inId').value.trim(),pw=$('#inPw').value,m=$('#loginMsg'),b=$('#btnLogin');
 if(!/^\d{5}$/.test(id)){m.textContent='학번 5자리를 입력하세요.';return}
 b.disabled=true;m.textContent='확인 중…';
 post('login',{id,pw}).then(r=>{m.textContent='';setMe(r);beep(660,.1);flush();r.mustChange?askPw(true):goMap()})
  .catch(err=>{m.textContent=err.server?err.message.replace(/^AUTH: /,''):'서버에 연결하지 못했다. 인터넷 연결을 확인하세요.'}).finally(()=>{b.disabled=false})});
$('#pwForm').addEventListener('submit',e=>{e.preventDefault();const a=$('#pw1').value,b=$('#pw2').value,m=$('#pwMsg'),btn=$('#btnPw');
 if(a.length<8){m.textContent='비밀번호는 8자리 이상이어야 한다.';return}
 if(a!==b){m.textContent='두 비밀번호가 서로 다르다.';return}
 if(a===me.id+'!!'){m.textContent='초기 비밀번호와 다른 비밀번호를 정해야 한다.';return}
 btn.disabled=true;m.textContent='변경 중…';
 call('changePw',{newPw:a}).then(r=>{me.token=r.token;try{sessionStorage.setItem('lsc-me',JSON.stringify({id:me.id,token:me.token}))}catch(x){}toast('비밀번호를 변경했다');goMap()})
  .catch(err=>{m.textContent=err.server?err.message.replace(/^AUTH: /,''):'서버에 연결하지 못했다.'}).finally(()=>{btn.disabled=false})});
$('#btnPwCancel').addEventListener('click',goMap);

/* ---------- 사이드스크롤 스테이지 ---------- */
const gc=$('#game'),g2=gc.getContext('2d');let VW=800,VH=480,SC=1,DPR=1;
const sc=$('#simCanvas'),s2=sc.getContext('2d');let SW=600,SH=400;
function resize(){DPR=Math.min(window.devicePixelRatio||1,1.5);const cw=gc.clientWidth,ch=gc.clientHeight;if(cw&&ch){SC=Math.min(ch/480,cw/560);VW=cw/SC;VH=ch/SC;gc.width=cw*DPR|0;gc.height=ch*DPR|0}
 const b=$('#simBox');if(b.clientWidth){SW=b.clientWidth;SH=b.clientHeight;sc.width=SW*DPR|0;sc.height=SH*DPR|0}}
window.addEventListener('resize',resize);

const SEG_W=370;
function newLevel(w1){return{w1,g:w1?1000:1900,jv:w1?560:680,plats:[],pits:[],lasers:[],drones:[],photons:[],hidden:false}}
function pickType(R,lvl,last){
 const w=[['plat',Math.max(.6,2-lvl*.25)],['pit',2],['drone',1.5],['wide',lvl>=1?1+lvl*.3:0],['laser',lvl>=2?1+lvl*.3:0],['fly',lvl>=3?.5+lvl*.25:0]].filter(a=>a[0]!==last);
 let s=0;w.forEach(a=>s+=a[1]);let x=R()*s;for(const a of w){x-=a[1];if(x<=0)return a[0]}return'pit'}
/* 구간 하나(폭 370)를 만든다. 구간마다 광자 자리 하나가 나온다. */
function addSeg(lv,R,type,s,lvl,withPhoton){
 const apex=lv.jv*lv.jv/(2*lv.g),maxH=Math.min(apex*.75,lv.w1?120:90),sp=70+lvl*12;let ph;
 if(type==='plat'){const pw=120+R()*40|0,py=55+R()*(maxH-55)|0,px=s+80+R()*30|0;lv.plats.push({x:px,y:py,w:pw});ph={x:px+pw/2,y:py+46};
  if(lvl>=2&&R()<.6){const uy=py+maxH*.85|0;lv.plats.push({x:px+pw+26,y:uy,w:84});ph={x:px+pw+68,y:uy+46}}}
 else if(type==='pit'){const pw=lv.w1?150+R()*50:95+R()*35,a=s+130;lv.pits.push({a,b:a+pw});ph={x:a+pw/2,y:apex*.6+24}}
 else if(type==='wide'){const a=s+(lv.w1?35:50),b=a+(lv.w1?305:275);lv.pits.push({a,b});lv.plats.push({x:a+14,y:0,w:86,mv:{a:a+14,b:b-100,v:60+lvl*8,d:1},dx:0});ph={x:(a+b)/2,y:96}}
 else if(type==='laser'){lv.lasers.push({x:s+185,on:1.1+lvl*.05,off:1.25,ph:R()*2});ph={x:s+185,y:34}}
 else if(type==='drone'){lv.drones.push({x:s+60,y:0,a:s+40,b:s+330,v:sp,dead:false});ph={x:s+185,y:34}}
 else{lv.drones.push({x:s+60,y:30,a:s+40,b:s+330,v:sp*.9,fly:true,dead:false});const px=s+130;lv.plats.push({x:px,y:maxH|0,w:110});ph={x:px+55,y:maxH+46}}
 if(withPhoton)lv.photons.push(ph)}
function fillSegs(lv,R,lvl,x,n,fixed,withPhoton){let last='';for(let i=0;i<n;i++){const t=fixed?fixed[i]:pickType(R,lvl,last);addSeg(lv,R,t,x,lvl,withPhoton);last=t;x+=SEG_W}return x}
const stageLvl=idx=>STAGES[idx].world===1?idx-4:idx;
function buildMain(idx){
 const lv=newLevel(STAGES[idx].world===1),lvl=stageLvl(idx),R=rng(1000+idx*77);
 let x=fillSegs(lv,R,lvl,400,7,lvl===0?['plat','pit','drone','plat','pit','plat','drone']:null,true);
 lv.station={x:x+150,done:false};lv.gateX=x+330;lv.doorX=x+490;
 x=fillSegs(lv,R,lvl,x+650,3,lvl===0?['plat','pit','plat']:null,true);
 lv.exitX=x+140;lv.L=x+300;return lv}
function buildHidden(idx){
 const lv=newLevel(STAGES[idx].world===1),lvl=Math.min(8,stageLvl(idx)+3),R=rng(5000+idx*31);lv.hidden=true;
 const x=fillSegs(lv,R,lvl,360,4,null,false);
 lv.station={x:x+140,done:false};lv.L=x+320;return lv}
const newPlayer=x=>({x,y:0,vx:0,vy:0,on:true,face:1,inv:0,kb:0,coy:0,ride:null,pit:null});
const laserOn=(l,t)=>((t+l.ph)%(l.on+l.off))<l.on;
const doorOpen=()=>run.main.station.done&&!(rec(run.def.id).hb>0);

function startStage(idx){const lv=buildMain(idx);

function paintHud(){const r=run;if(!r)return;const h=r.lv.hidden;
 $('#hudStage').textContent=h?'숨겨진 공간 · '+HID[r.def.id].title:stageNo(r.idx)+' '+r.def.name;
 $('#hudPhoton').textContent=r.got;$('#hudPhBox').hidden=h;$('#hudMission').textContent=r.main.station.done?r.mission+'점':'대기';
 $('#hudEn').textContent='●'.repeat(Math.max(0,r.energy))+'○'.repeat(3-Math.max(0,r.energy));
 $('#hudTimeBox').className='chip'+(h?' warn':'');r.hudT=''}
function hurt(){const r=run,p=r.p;if(p.inv>0)return;if(!r.lv.hidden)r.hits++;r.energy--;p.inv=1.5;p.kb=.3;p.vx=p.face>0?-300:300;p.vy=300;beep(140,.2,'sawtooth',.06);

 if(r.energy<=0)respawn('에너지가 바닥났다.');else paintHud()}
function respawn(why){const r=run,p=r.p;r.falls++;p.x=r.lv.hidden?120:r.cp;p.y=0;p.vx=p.vy=0;p.pit=null;p.ride=null;p.on=true;p.inv=2;p.kb=0;r.energy=3;paintHud();toast(why+' 구간 처음으로 돌아간다.');beep(110,.3,'sawtooth',.06)}

 if(lv.hidden){r.hLeft-=dt;if(r.hLeft<=0){failHidden('시간 초과.');return}}else r.time+=dt;
 if(r.banner>0)r.banner-=dt;if(r.gateMsg>0)r.gateMsg-=dt;if(p.inv>0)p.inv-=dt;
 for(const pl of lv.plats)if(pl.mv){const m=pl.mv,ox=pl.x;pl.x+=m.v*m.d*dt;if(pl.x<m.a){pl.x=m.a;m.d=1}else if(pl.x>m.b){pl.x=m.b;m.d=-1}pl.dx=pl.x-ox}
 if(p.ride&&p.ride.mv)p.x+=p.ride.dx;
 const dir=(keys.right?1:0)-(keys.left?1:0);
 if(p.kb>0)p.kb-=dt;else{p.vx+=(dir*240-p.vx)*Math.min(1,dt*14);if(dir)p.face=dir}
 if(keys.jumpQ>0){keys.jumpQ-=dt;if(p.coy>0){p.vy=lv.jv;p.coy=0;keys.jumpQ=0;beep(520,.07,'square',.03)}}
 p.vy-=lv.g*dt;const y0=p.y;p.x+=p.vx*dt;p.y+=p.vy*dt;p.on=false;p.ride=null;
 if(p.y>=0)p.pit=null;else if(p.pit)p.x=clamp(p.x,p.pit.a+10,p.pit.b-10);
 const pit=p.pit||lv.pits.find(q=>p.x>q.a+6&&p.x<q.b-6);
 if(p.y<=0&&!pit){p.y=0;p.vy=0;p.on=true}
 else{if(p.vy<=0)for(const pl of lv.plats)if(p.x>pl.x-10&&p.x<pl.x+pl.w+10&&y0>=pl.y&&p.y<=pl.y){p.y=pl.y;p.vy=0;p.on=true;p.ride=pl;break}
  if(!p.on&&p.y<0&&pit)p.pit=pit}
 if(p.on)p.coy=.09;else p.coy-=dt;
 if(p.y<-260){respawn('구덩이에 빠졌다.');return}
 if(lv.gateX&&!lv.station.done&&p.x>lv.gateX-18){p.x=lv.gateX-18;p.vx=0;r.gateMsg=1.6}
 p.x=clamp(p.x,20,lv.L-20);
 if(!lv.hidden&&r.cp<lv.station.x-70&&p.on&&p.x>lv.station.x-70)r.cp=lv.station.x-70;
 for(const ph of lv.photons)if(!ph.got&&Math.abs(ph.x-p.x)<26&&Math.abs(ph.y-(p.y+24))<34){ph.got=true;r.got++;$('#hudPhoton').textContent=r.got;beep(880+r.got*40,.09,'triangle',.06);burst(ph.x,ph.y,C.photon)}
 for(const d of lv.drones){if(d.dead)continue;d.x+=d.v*dt;if(d.x<d.a){d.x=d.a;d.v=Math.abs(d.v)}else if(d.x>d.b){d.x=d.b;d.v=-Math.abs(d.v)}
  if(Math.abs(d.x-p.x)<30&&p.y<d.y+26&&p.y+48>d.y){if(p.vy<-60&&p.y>d.y+8){d.dead=true;p.vy=lv.jv*.6;burst(d.x,d.y+16,C.r);beep(200,.15,'square',.05)}else hurt()}}
 for(const l of lv.lasers)if(laserOn(l,r.t)&&Math.abs(l.x-p.x)<16&&p.y<190)hurt();
 if(state!=='play'||run!==r||r.lv!==lv)return;
 let near='';if(!lv.station.done&&Math.abs(p.x-lv.station.x)<85)near='station';else if(!lv.hidden&&doorOpen()&&Math.abs(p.x-lv.doorX)<70)near='door';
 if(near!==r.near){r.near=near;const b=$('#bAct');b.hidden=!near;b.textContent=near==='door'?'비밀 문':'조사'}
 if(keys.act){keys.act=false;if(near==='station'){openSim(lv.hidden);return}if(near==='door'){openDoor();return}}

}

 if(!hidden&&!run.counted){run.counted=true;const rc=myRec(run.def.id);rc.a++;run.attemptNo=rc.a;enqueue('attempt',{stage:run.def.id})}
 sim={def,s:def.init(),step:0,tries:0,hint:false,scores:[],solved:false,failed:false,hidden:!!hidden};
 $('#simTitle').textContent=hidden?def.title:run.def.name;$('#simTimer').hidden=!hidden;
 const intro=$('#simIntro');intro.hidden=!hidden;intro.textContent=hidden?def.intro:'';
 show('sim');resize();enterStep()}
function enterStep(){const st=sim.def.steps[sim.step];sim.tries=0;sim.hint=false;sim.solved=false;if(st.enter)st.enter(sim.s);
 $('#simDots').innerHTML=sim.hidden?'':sim.def.steps.map((_,i)=>'<i class="'+(i<sim.step?'done':i===sim.step?'now':'')+'"></i>').join('');
 $('#simText').textContent=(sim.hidden?'확장 미션. ':'미션 '+(sim.step+1)+'. ')+st.text;
 const fb=$('#simFeedback');fb.hidden=true;fb.className='';
 $('#simNext').hidden=true;$('#simCheck').hidden=!!st.options;$('#simHint').hidden=sim.hidden;$('#simHint').disabled=false;$('#simExit').hidden=false;
 const ob=$('#simOptions');ob.innerHTML='';
 if(st.options)st.options.forEach((o,i)=>{const b=document.createElement('button');b.type='button';b.textContent=o;b.addEventListener('click',()=>{if(sim.solved)return;if(i===st.answer){b.classList.add('right');solve()}else{b.classList.add('wrong');b.disabled=true;miss('다시 생각해 보자. 실험 장치를 조작해 확인할 수 있다.',o)}});ob.appendChild(b)});
 buildControls();
}
function buildControls(){const box=$('#simControls'),s=sim.s;box.innerHTML='';
 (sim.def.controls||[]).forEach(ct=>{const row=document.createElement('div');row.className='ctl';
  if(ct.type==='range'){row.innerHTML=`<label for="c_${ct.key}">${ct.label}</label><output></output><input id="c_${ct.key}" type="range" min="${ct.min}" max="${ct.max}" step="${ct.step}" value="${s[ct.key]}">`;
   const inp=row.querySelector('input'),out=row.querySelector('output'),up=()=>{out.textContent=(ct.fmt?ct.fmt(s[ct.key]):s[ct.key])+(ct.unit||'')};inp.addEventListener('input',()=>{s[ct.key]=+inp.value;up()});up()}
  else if(ct.type==='select'){row.innerHTML=`<span class="lab">${ct.label}</span><span></span><div class="seg"></div>`;const seg=row.querySelector('.seg');
   ct.options.forEach(o=>{const b=document.createElement('button');b.type='button';b.textContent=o.label;b.setAttribute('aria-pressed',s[ct.key]===o.v);b.addEventListener('click',()=>{s[ct.key]=o.v;seg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));beep(440,.04)});seg.appendChild(b)})}
  else if(ct.type==='toggle'){row.innerHTML=`<span class="lab">${ct.label}</span><span></span><div class="seg"></div>`;const seg=row.querySelector('.seg');
   ct.items.forEach(o=>{const b=document.createElement('button');b.type='button';b.className=o.cls||'';b.textContent=o.label;b.setAttribute('aria-pressed',!!s[o.key]);b.addEventListener('click',()=>{s[o.key]=s[o.key]?0:1;b.setAttribute('aria-pressed',!!s[o.key]);beep(440,.04)});seg.appendChild(b)})}
  else if(ct.type==='btn'){row.innerHTML='<div class="seg"></div>';const b=document.createElement('button');b.type='button';b.textContent=ct.label;b.setAttribute('aria-pressed','true');b.addEventListener('click',()=>ct.action(s));row.firstChild.appendChild(b)}
  box.appendChild(row)})}
function feedback(cls,msg){const fb=$('#simFeedback');fb.className=cls;fb.textContent=msg;fb.hidden=false}
function miss(msg,logText){const st=sim.def.steps[sim.step];addLog('오답',logText);beep(160,.18,'sawtooth',.05);
 if(sim.hidden){sim.solved=true;sim.failed=true;feedback('bad','실패. '+(st.options?'':msg+' ')+st.explain);$('#simCheck').hidden=true;$('#simExit').hidden=true;const n=$('#simNext');n.hidden=false;n.textContent='돌아가기';return}
 sim.tries++;feedback('bad',msg)}
function solve(){const st=sim.def.steps[sim.step];sim.solved=true;$('#simCheck').hidden=true;$('#simHint').hidden=true;const n=$('#simNext');n.hidden=false;
 if(sim.hidden){feedback('good','성공! 보너스 +'+hBonus(rec(run.def.id).ht)+'점. '+st.explain);$('#simExit').hidden=true;n.textContent='보너스 받고 돌아가기';jingle([660,880,1047]);return}
 const pts=Math.max(25,100-25*sim.tries-(sim.hint?15:0));sim.scores.push(pts);
 feedback('good','성공 +'+pts+'점. '+st.explain);jingle([660,880]);n.textContent=sim.step===sim.def.steps.length-1?'장치 가동':'다음 미션';
 $('#simDots').children[sim.step].className='done'}
$('#simCheck').addEventListener('click',()=>{if(!sim)return;const st=sim.def.steps[sim.step];if(sim.solved||!st.ok)return;if(st.ok(sim.s))solve();else miss(st.fail?st.fail(sim.s):'아직 아니다. 다시 조절해 보자.',sim.def.read?sim.def.read(sim.s):'')});
$('#simHint').addEventListener('click',()=>{if(!sim||sim.hidden)return;const st=sim.def.steps[sim.step];sim.hint=true;$('#simHint').disabled=true;addLog('힌트','힌트 사용');feedback('hint','힌트: '+st.hint)});
$('#simNext').addEventListener('click',()=>{if(!sim)return;
 if(sim.hidden){sim.failed?failHidden('오답.'):winHidden();return}
 sim.step++;
 if(sim.step>=sim.def.steps.length){run.mission=sim.scores.reduce((a,b)=>a+b,0);run.main.station.done=true;run.near='';$('#bAct').hidden=true;sim=null;flushLogs();show('play');paintHud();toast('차단막이 열렸다');jingle([523,659,784])}
 else enterStep()});
$('#simExit').addEventListener('click',()=>{sim=null;flushLogs();show('play')});
sc.addEventListener('pointerdown',e=>{if(!sim||!sim.def.tap||sim.solved)return;const r=sc.getBoundingClientRect();sim.def.tap(sim.s,e.clientX-r.left,e.clientY-r.top,SW,SH);beep(500,.04)});

/* ---------- 결과 ---------- */
function finishStage(){
 const r=run,id=r.def.id,time=Math.max(1,Math.round(r.time)),att=r.attemptNo||1,c=calc(r.mission,r.got,r.hits,time,att),rc=myRec(id),rk0=rank(total()),prev=rc.clr?rc.s:null;
 if(!rc.clr||c.score>rc.s||(c.score===rc.s&&time<rc.t))Object.assign(rc,{s:c.score,acc:c.acc,tb:c.tb,t:time,star:starOf(c.score),ph:r.got});
 rc.clr=true;
 const ctx={mission:r.mission,got:r.got,hits:r.hits,falls:r.falls,time},fresh=BADGES.filter(b=>!me.badges.includes(b.id)&&b.ok(ctx));fresh.forEach(b=>me.badges.push(b.id));
 enqueue('finish',{stage:id,mission:r.mission,photons:r.got,hits:r.hits,time,badges:fresh.map(b=>b.id)});
 const rk1=rank(total()),ni=r.idx+1<STAGES.length?r.idx+1:-1,stars=starOf(c.score);
 let h=`<p class="eyebrow">STAGE ${stageNo(r.idx)} 클리어 · ${att}번째 도전</p><h2>${r.def.name}</h2><div class="bigstars">${starStr(stars)}</div>
 <dl class="tally"><dt>미션 3개</dt><dd>${r.mission}</dd><dt>광자 ${r.got}/10</dt><dd>+${r.got*10}</dd><dt>충돌 ${r.hits}회</dt><dd>-${r.hits*10}</dd>
 <dt class="sub">정확도 점수 (최대 400)</dt><dd class="sub">${c.acc}</dd><dt>시간 보너스 · 소요 ${fmtT(time)}</dt><dd>+${c.tb}</dd><dt>도전 계수 (${att}번째)</dt><dd>× ${Math.round(c.coef*100)}%</dd>
 <dt class="sub">이번 스테이지 점수</dt><dd class="sub tot">${c.score}</dd><dt>숨겨진 공간 보너스</dt><dd>${rc.hb?'+'+rc.hb:'미도전'}</dd><dt>랭킹 반영 (최고 기록 + 보너스)</dt><dd class="tot">${rc.s+rc.hb}</dd></dl><div class="news">`;
 if(prev!=null&&c.score<=prev)h+=`<p>이 스테이지의 최고 기록 ${prev}점이 유지된다.</p>`;
 if(c.tb<100)h+=`<p>2분 30초 안에 클리어하면 시간 보너스가 만점(100점)이다.</p>`;
 if(rk1>rk0)h+=`<p>등급 상승: ${RANKS[rk1][1]}</p>`;
 fresh.forEach(b=>h+=`<p>새 뱃지 「${b.name}」 · ${b.desc}</p>`);
 h+=`</div><p class="dim sync"></p><div class="card"><h4>오늘 확인한 개념</h4><ul>${r.def.concept.map(x=>'<li>'+x+'</li>').join('')}${rc.hb?'<li style="color:var(--photon)">확장: '+HID_CONCEPT[id]+'</li>':''}</ul></div><div class="row">`;
 if(ni>=0&&unlocked(ni))h+=`<button class="btn" type="button" data-act="next" data-i="${ni}">다음 스테이지</button>`;
 h+=`<button class="btn ghost" type="button" data-act="retry" data-i="${r.idx}">다시 도전 (계수 ${Math.round(coefOf(att+1)*100)}%)</button><button class="btn ghost" type="button" data-act="map">지도</button></div>`;
 $('#resBox').innerHTML=h;show('result');paintSync();jingle([523,659,784,1047]);
}

/* ---------- 입력 ---------- */
function hold(el,on,off){el.addEventListener('pointerdown',e=>{e.preventDefault();try{el.setPointerCapture(e.pointerId)}catch(x){}el.classList.add('down');on()});
 ['pointerup','pointercancel','lostpointercapture'].forEach(n=>el.addEventListener(n,()=>{el.classList.remove('down');if(off)off()}))}
hold($('#bLeft'),()=>keys.left=true,()=>keys.left=false);hold($('#bRight'),()=>keys.right=true,()=>keys.right=false);
hold($('#bJump'),()=>keys.jumpQ=.14);hold($('#bAct'),()=>keys.act=true);
document.addEventListener('contextmenu',e=>{if(e.target.tagName!=='INPUT')e.preventDefault()});
window.addEventListener('keydown',e=>{if(state!=='play')return;const k=e.key;if(k==='ArrowLeft'||k==='a')keys.left=true;else if(k==='ArrowRight'||k==='d')keys.right=true;else if((k===' '||k==='ArrowUp'||k==='w')&&!e.repeat){keys.jumpQ=.14;e.preventDefault()}else if(k==='e'||k==='Enter')keys.act=true});
window.addEventListener('keyup',e=>{const k=e.key;if(k==='ArrowLeft'||k==='a')keys.left=false;else if(k==='ArrowRight'||k==='d')keys.right=false});
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
 if(a==='rank'){b.disabled=true;loadRank().then(()=>toast('랭킹을 새로 불러왔다'))}
 else if(a==='hgo')enterHidden();
 else if(a==='hno'){$('#modal').hidden=true;state='play'}
 else if(a==='next'||a==='retry')startStage(+b.dataset.i);
 else if(a==='map')goMap()});
$('#btnFull').addEventListener('click',()=>{try{const p=document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();if(p&&p.catch)p.catch(()=>toast('이 화면에서는 전체 화면을 쓸 수 없다'))}catch(e){}});
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){tab=b.dataset.tab;renderMap();if(tab==='rank')loadRank()}});
$('#mapBody').addEventListener('click',e=>{const b=e.target.closest('.stage');if(b&&!b.disabled)startStage(+b.dataset.i)});
$('#btnLogout').addEventListener('click',()=>logout(''));
$('#btnChangePw').addEventListener('click',()=>askPw(false));
$('#btnQuit').addEventListener('click',()=>{const b=$('#btnQuit');if(run&&Date.now()-run.quit<2500){b.textContent='지도';flushLogs();goMap()}else if(run){run.quit=Date.now();b.textContent='한 번 더: 나가기';setTimeout(()=>{b.textContent='지도'},2500)}});
const muteLabel=()=>{$('#btnMute').textContent=prefs.mute?'소리 끔':'소리 켬'};muteLabel();
$('#btnMute').addEventListener('click',()=>{prefs.mute=!prefs.mute;savePrefs();muteLabel()});

/* ---------- 루프·시작 ---------- */
let last=0;
function frame(ts){const dt=Math.min(.033,(ts-last)/1000||0);last=ts;clock+=dt;
 if(state==='play'&&run){update(dt);if(state==='play'&&run)render()}
 else if(state==='sim'&&sim){const d=sim.def;
  if(sim.hidden&&!sim.solved){run.hLeft-=dt;if(run.hLeft<=0){failHidden('시간 초과.');requestAnimationFrame(frame);return}}
  else if(!sim.hidden)run.time+=dt;
  if(sim.hidden)$('#simTimer').textContent=fmtT(Math.ceil(run.hLeft));
  if(d.update)d.update(sim.s,dt);s2.setTransform(DPR,0,0,DPR,0,0);simBg(s2,SW,SH);d.draw(s2,SW,SH,sim.s,clock);$('#simRead').textContent=d.read?d.read(sim.s):''}
 requestAnimationFrame(frame)}
async function boot(){
 $('#demoNote').hidden=!DEMO;paintRank();resize();requestAnimationFrame(frame);
 let s=null;try{s=JSON.parse(sessionStorage.getItem('lsc-me'))}catch(e){}
 if(s&&s.token){try{const r=await post('state',{token:s.token});setMe(r,s.token);r.mustChange?askPw(true):goMap()}catch(e){try{sessionStorage.removeItem('lsc-me')}catch(x){}}}
 loadRank();flush()}
boot();

})();
</script>
</body>
